# Experiment: Hard Task with ULTRA DIVERSE Mix GP (Synthetic Switch)
# Tests if maximum prior diversity makes synthetic data more helpful

experiment_name: null  # Auto-generated
experiment_prefix: hard_ultra
switch_epoch: 100      # Switch when still underfit
total_epochs: 200      # Long enough to see if improvement continues
synthetic_mode: sample
synthetic_ratio: 1.0
use_autoregressive_synthetic: true

# Hard task parameters
prior: mix_gp
num_features: 30      # vs 30 in original experiments
loss_function: gaussnll
bptt: 50             # vs 50 in original experiments
batch_size: 1000
steps_per_epoch: 20

# Model architecture
emsize: 512
nlayers: 6
nhid: 1024
nhead: 4
dropout: 0.0

# Training parameters
lr: 0.001
warmup_epochs: 50      # Match original for stability
validation_period: 10
permutation_invariant_max_eval_pos: null
permutation_invariant_sampling: weighted

# Encoder parameters
encoder: linear
y_encoder: linear
pos_encoder: sinus

# ULTRA DIVERSE Mix GP - Maximum hyperparameter variation + kernel diversity
extra_prior_kwargs_dict:
  fuse_x_y: false
  hyperparameters:
    # Use same base params as very_diverse (proven stable) + kernel diversity
    lengthscale_concentration: 1.0         # Same as very_diverse (stable)
    lengthscale_rate: 2.0                  # Same as very_diverse
    outputscale_concentration: 0.2         # Same as very_diverse (stable)
    outputscale_rate: 0.05                 # Same as very_diverse
    noise_concentration: 0.8               # Same as very_diverse (stable, mean=26.7)
    noise_rate: 0.03                       # Same as very_diverse (proven to work)
    nu: "random"                           # Random smoothness: {0.5, 1.5, 2.5}
    kernel_type: "random"                  # NEW: 4 kernel types add massive diversity!

# Paths
save_dir: ./experiments/underfit_learning/checkpoints
metrics_dir: ./experiments/underfit_learning/metrics
generate_plots: true
