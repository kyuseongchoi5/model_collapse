# Configuration file for model collapse experiment
# Use with: python train_with_switch.py --config config.yaml

# Experiment parameters
experiment_name: null  # Auto-generated if not specified
switch_epoch: 100      # Epoch to switch from true to synthetic data
total_epochs: 200      # Total training epochs
synthetic_mode: sample # 'mean' or 'sample' - how to generate synthetic Y
synthetic_ratio: 1.0   # Ratio of synthetic data after switch (1.0 = pure)
use_autoregressive_synthetic: false  # Use slower autoregressive generation

# Data parameters
prior: gp              # 'gp', 'mix_gp', 'ridge', or 'stroke'
num_features: 1        # Number of input features (default: 1 for simple regression)
loss_function: gaussnll  # 'gaussnll', 'mse', 'ce', or 'barnll'
bptt: 10              # Sequence length
batch_size: 1000      # Batch size
steps_per_epoch: 100  # Number of batches per epoch

# Model architecture
emsize: 512           # Embedding dimension
nlayers: 6            # Number of transformer layers
nhid: 1024            # Hidden dimension (default: 2*emsize)
nhead: 4              # Number of attention heads
dropout: 0.0          # Dropout rate

# Training parameters
lr: 0.001             # Learning rate
warmup_epochs: 50     # Warmup epochs for learning rate
validation_period: 10 # Save checkpoint every N epochs

# Encoder parameters
encoder: linear       # 'linear', 'mlp', or 'positional'
y_encoder: linear     # 'linear', 'mlp', or 'positional'
pos_encoder: sinus    # 'sinus', 'learned', or 'none'

# Extra prior kwargs
extra_prior_kwargs_dict:
  fuse_x_y: false

# Paths
save_dir: ./experiments/iterative_collapse/checkpoints
metrics_dir: ./experiments/iterative_collapse/metrics


