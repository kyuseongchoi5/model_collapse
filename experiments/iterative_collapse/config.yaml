# Configuration file for model collapse experiment
# Use with: python train_with_switch.py --config config.yaml

# Experiment parameters
experiment_name: null  # Auto-generated if not specified
switch_epoch: 200      # Epoch to switch from true to synthetic data (more pre-training)
total_epochs: 400      # Total training epochs (2x to see full collapse)
synthetic_mode: sample # 'mean' or 'sample' - how to generate synthetic Y
synthetic_ratio: 1.0   # Ratio of synthetic data after switch (1.0 = pure)
use_autoregressive_synthetic: true  # Use autoregressive generation (preserves correlation)

# Data parameters (HARDER TASK)
prior: gp              # 'gp', 'mix_gp', 'ridge', or 'stroke'
num_features: 30       # 30D regression (3x harder than previous)
loss_function: gaussnll  # 'gaussnll', 'mse', 'ce', or 'barnll'
bptt: 100              # Sequence length (2x longer)
batch_size: 1000      # Batch size
steps_per_epoch: 20   # Reduced for autoregressive (5x fewer but ~100x slower per batch)

# Model architecture (LARGER for harder task)
emsize: 768           # Embedding dimension (50% larger)
nlayers: 8            # Number of transformer layers (more depth)
nhid: 1536            # Hidden dimension (2*emsize)
nhead: 8              # Number of attention heads (2x)
dropout: 0.0          # Dropout rate

# Training parameters
lr: 0.0005            # Lower LR for larger model
warmup_epochs: 100    # Longer warmup for harder task
validation_period: 20 # Save checkpoint every N epochs
permutation_invariant_max_eval_pos: null  # Max eval pos (null uses bptt)
permutation_invariant_sampling: weighted  # 'weighted' or 'uniform'

# Encoder parameters
encoder: linear       # 'linear', 'mlp', or 'positional'
y_encoder: linear     # 'linear', 'mlp', or 'positional'
pos_encoder: sinus    # 'sinus', 'learned', or 'none'

# Extra prior kwargs
extra_prior_kwargs_dict:
  fuse_x_y: false

# Paths
save_dir: ./experiments/iterative_collapse/checkpoints
metrics_dir: ./experiments/iterative_collapse/metrics


