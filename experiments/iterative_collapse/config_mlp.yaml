# Experiment: MLP Prior (Random Neural Networks)
# Tests extreme diversity - random NN outputs instead of smooth GPs

experiment_name: null  # Auto-generated
switch_epoch: 100
total_epochs: 200
synthetic_mode: sample
synthetic_ratio: 1.0
use_autoregressive_synthetic: true

# Data parameters
prior: mlp             # Random neural network functions (extremely diverse)
num_features: 30       # 10D for comparison with Mix GP
loss_function: mse     # MLP outputs deterministic values, not distributions
bptt: 50
batch_size: 1000
steps_per_epoch: 100   # MLP generation is fast

# Model architecture
emsize: 512
nlayers: 6
nhid: 1024
nhead: 4
dropout: 0.0

# Training parameters
lr: 0.001
warmup_epochs: 50
validation_period: 10
permutation_invariant_max_eval_pos: null
permutation_invariant_sampling: weighted

# Encoder parameters
encoder: linear
y_encoder: linear
pos_encoder: sinus

# Extra prior kwargs
extra_prior_kwargs_dict:
  fuse_x_y: false

# Paths
save_dir: ./experiments/iterative_collapse/checkpoints
metrics_dir: ./experiments/iterative_collapse/metrics
generate_plots: true
