# Early Switch Configuration
# Switch to synthetic data early (epoch 50) to observe faster collapse

experiment_name: early_switch_epoch50
switch_epoch: 50       # Early switch
total_epochs: 200
synthetic_mode: sample
synthetic_ratio: 1.0
use_autoregressive_synthetic: false

# Data parameters (same as baseline)
prior: gp
num_features: 1
loss_function: gaussnll
bptt: 10
batch_size: 1000
steps_per_epoch: 100

# Model architecture (same as baseline)
emsize: 512
nlayers: 6
nhid: 1024
nhead: 4
dropout: 0.0

# Training parameters
lr: 0.001
warmup_epochs: 50
validation_period: 10
permutation_invariant_max_eval_pos: null
permutation_invariant_sampling: weighted

# Encoder parameters
encoder: linear
y_encoder: linear
pos_encoder: sinus

# Extra prior kwargs
extra_prior_kwargs_dict:
  fuse_x_y: false

# Paths
save_dir: ./experiments/iterative_collapse/checkpoints
metrics_dir: ./experiments/iterative_collapse/metrics
